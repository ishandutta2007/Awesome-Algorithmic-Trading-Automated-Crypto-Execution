<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="bullGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.45" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(30px, -15px); opacity: 0.6; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes tickerFade {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes wavePing {
      0% { r: 4px; opacity: 1; }
      100% { r: 16px; opacity: 0; }
    }

    .bg-orb1 { animation: pulseOrb 12s ease-in-out infinite; transform-origin: 200px 100px; }
    .bg-orb2 { animation: pulseOrb 15s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .chart-line { stroke-dasharray: 8 4; animation: dashMove 25s linear infinite; }
    .signal-flow { stroke-dasharray: 6 6; animation: dashMove 12s linear infinite; }
    .floating-card-1 { animation: floatCard 6s ease-in-out infinite; }
    .floating-card-2 { animation: floatCard 7s ease-in-out infinite 1s; }
    .ping-circle { animation: wavePing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle class="bg-orb1" cx="220" cy="120" r="180" fill="url(#glowCyan)" filter="url(#softGlow)" />
  <circle class="bg-orb2" cx="980" cy="280" r="220" fill="#6366f1" opacity="0.2" filter="url(#softGlow)" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Candlestick / Trading Background Visual (Deep Background Layer) -->
  <g opacity="0.18">
    <!-- Candlestick wicks & bodies -->
    <line x1="80" y1="260" x2="80" y2="380" stroke="#10b981" stroke-width="2"/>
    <rect x="74" y="280" width="12" height="70" fill="#10b981" rx="2"/>

    <line x1="140" y1="210" x2="140" y2="340" stroke="#10b981" stroke-width="2"/>
    <rect x="134" y="230" width="12" height="80" fill="#10b981" rx="2"/>

    <line x1="200" y1="250" x2="200" y2="360" stroke="#ef4444" stroke-width="2"/>
    <rect x="194" y="260" width="12" height="60" fill="#ef4444" rx="2"/>

    <line x1="260" y1="180" x2="260" y2="310" stroke="#10b981" stroke-width="2"/>
    <rect x="254" y="200" width="12" height="90" fill="#10b981" rx="2"/>

    <line x1="940" y1="160" x2="940" y2="320" stroke="#10b981" stroke-width="2"/>
    <rect x="934" y="190" width="12" height="90" fill="#10b981" rx="2"/>

    <line x1="1010" y1="140" x2="1010" y2="290" stroke="#10b981" stroke-width="2"/>
    <rect x="1004" y="160" width="12" height="100" fill="#10b981" rx="2"/>

    <line x1="1080" y1="120" x2="1080" y2="270" stroke="#10b981" stroke-width="2"/>
    <rect x="1074" y="130" width="12" height="110" fill="#10b981" rx="2"/>

    <line x1="1140" y1="100" x2="1140" y2="240" stroke="#10b981" stroke-width="2"/>
    <rect x="1134" y="110" width="12" height="90" fill="#10b981" rx="2"/>
  </g>

  <!-- Dynamic Algorithmic Sine / Growth Curve Fill -->
  <path d="M 0 380 Q 250 350, 450 310 T 800 240 T 1200 130 L 1200 420 L 0 420 Z" fill="url(#bullGrad)" />
  <path class="chart-line" d="M 0 380 Q 250 350, 450 310 T 800 240 T 1200 130" fill="none" stroke="#10b981" stroke-width="3" opacity="0.8" />
  
  <!-- Secondary Algorithmic Signal Line -->
  <path class="signal-flow" d="M 0 320 Q 300 240, 600 290 T 1200 180" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

  <!-- Animated Execution Nodes / Signal Triggers -->
  <g transform="translate(450, 310)">
    <circle class="ping-circle" cx="0" cy="0" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#neonGlow)"/>
  </g>
  <g transform="translate(800, 240)">
    <circle class="ping-circle" cx="0" cy="0" r="8" fill="none" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#34d399" filter="url(#neonGlow)"/>
  </g>
  <g transform="translate(1050, 160)">
    <circle class="ping-circle" cx="0" cy="0" r="8" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#818cf8" filter="url(#neonGlow)"/>
  </g>

  <!-- Floating Dynamic Tech Cards (Placed to Left & Right to keep center foreground clear) -->
  <g class="floating-card-1" transform="translate(50, 60)">
    <rect width="180" height="70" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <circle cx="24" cy="25" r="6" fill="#10b981"/>
    <text x="38" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">EXECUTION STATUS</text>
    <text x="22" y="52" fill="#34d399" font-family="Courier, monospace" font-size="13" font-weight="bold">● LIVE: 0.12ms LATENCY</text>
  </g>

  <g class="floating-card-2" transform="translate(970, 50)">
    <rect width="180" height="70" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <circle cx="24" cy="25" r="6" fill="#6366f1"/>
    <text x="38" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">SMART ORDER ROUTER</text>
    <text x="22" y="52" fill="#818cf8" font-family="Courier, monospace" font-size="13" font-weight="bold">ARBITRAGE +0.48%</text>
  </g>

  <!-- FOREGROUND: Core Title, Subtitle, Badges (Crisp, High Contrast, Guaranteed Clear) -->
  <g id="foreground-content">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 75)">
      <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1.2" />
      <circle cx="-145" cy="0" r="5" fill="#10b981" filter="url(#neonGlow)" />
      <text x="0" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">⚡ QUANT &amp; CRYPTO EXECUTION ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Algorithmic Trading &amp; Automated Crypto
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="20" font-weight="500" fill="#f8fafc">
      Institutional-Grade Execution Engines, Backtesting Frameworks &amp; Self-Hosted Bots
    </text>

    <!-- Category Feature Pills Row -->
    <g transform="translate(600, 250)">
      <!-- Pill 1: Backtesting Engines -->
      <g transform="translate(-330, 0)">
        <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1"/>
        <text x="75" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📊 Backtesting</text>
      </g>

      <!-- Pill 2: HFT & Market Making -->
      <g transform="translate(-165, 0)">
        <rect x="0" y="0" width="155" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1"/>
        <text x="77" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Market Making</text>
      </g>

      <!-- Pill 3: Self-Hosted Bots -->
      <g transform="translate(5, 0)">
        <rect x="0" y="0" width="155" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1"/>
        <text x="77" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🤖 Self-Hosted Bots</text>
      </g>

      <!-- Pill 4: CEX & DEX Arbitrage -->
      <g transform="translate(175, 0)">
        <rect x="0" y="0" width="155" height="34" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1"/>
        <text x="77" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🌐 CEX &amp; DEX APIs</text>
      </g>
    </g>

    <!-- Bottom Highlights -->
    <text x="600" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Curated Open-Source Libraries • Commercial SaaS Platforms • High-Frequency Order Routing
    </text>
  </g>
</svg>
